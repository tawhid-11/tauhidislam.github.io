name: Deploy Angular App to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Angular Application
        run: npm run build:gh

      - name: Prepare SPA for GitHub Pages
        run: |
          cp dist/ng-portfolio/browser/index.html dist/ng-portfolio/browser/404.html
          touch dist/ng-portfolio/browser/.nojekyll

      - name: Deploy to GitHub Pages (gh-pages)
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist/ng-portfolio/browser
          clean: true
