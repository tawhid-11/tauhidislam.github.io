<canvas id="gradient-canvas"></canvas>

<app-header />

<div class="banner">
    <div class="inner">
        <img class="avatar" src="assets/img/tawhid.png" alt="Md. Tauhid Islam" srcset="assets/img/tawhid.png" onerror="this.src='assets/img/placeholder-img.jpeg'">
        <h1 class="heading animated-gradient-text">Md. Tauhid Islam</h1>
        <p class="subtitle">Jr. Software Engineer</p>

        <div class="hashtag">
            <p class="hashtag-text">#{{currentHashtag}}</p>
        </div>

        <app-infinite-scrolling-items [config]="infiniteScrollConfig">
            <div class="skills">
                @for (skill of skills; track $index; let i = $index) {
                    <p><strong>#</strong>{{skill}}</p>
                }
            </div>
        </app-infinite-scrolling-items>
    </div>
</div>
